services:
  - type: web
    name: amanecer-staging-api
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --prefix backend
    startCommand: node backend/src/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: EMAIL_HOST
        value: smtp.resend.com
      - key: EMAIL_PORT
        value: "465"
      - key: EMAIL_USER
        value: resend
      - key: EMAIL_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: HOTEL_CONTACT_EMAIL
        sync: false
      - key: FRONTEND_BASE_URL
        value: https://amanecer-five.vercel.app
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_JWT_SECRET
        generateValue: true
